<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <script>
    (function(){try{
      if(typeof PayAppCreditReport!=='undefined'&&PayAppCreditReport.getScreenDpWidth){
        var w=PayAppCreditReport.getScreenDpWidth();
        if(w>0)document.querySelector('meta[name="viewport"]').setAttribute('content','width='+w+',initial-scale=1.0,viewport-fit=cover');
      }
    }catch(e){}})();
    </script>
    <title>云闪付 UI Shell</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
